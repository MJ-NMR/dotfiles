<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>

    <!-- Global Arabic Script Hook (Crucial for GTK apps like Dialect) -->
    <match target="pattern">
        <test name="lang" compare="contains"><string>ar</string></test>
        <edit name="family" mode="prepend" binding="strong">
            <string>IBM Plex Sans Arabic</string>
        </edit>
    </match>

    <!-- Map Amiri to all Serif requests containing Arabic script -->
    <match target="pattern">
        <test qual="any" name="family"><string>serif</string></test>
        <edit name="family" mode="prepend" binding="same">
            <string>Amiri</string>
        </edit>
    </match>

    <!-- Map Amiri as fallback for Sans-Serif requests -->
    <match target="pattern">
        <test qual="any" name="family"><string>sans-serif</string></test>
        <edit name="family" mode="append" binding="same">
            <string>Cairo</string>
        </edit>
    </match>

    <!-- scale the Arabic font -->
    <match target="font">
        <test name="lang" compare="contains"><string>ar</string></test>
        <edit name="pixelsize" mode="assign">
            <times><name>pixelsize</name><double>1.2</double></times>
        </edit>
    </match>
</fontconfig>
