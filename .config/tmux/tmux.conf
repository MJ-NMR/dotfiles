##keymaps
#global
unbind C-b
set -g prefix M-s
bind-key -n M-w choose-session
bind-key -n M-c copy-mode
bind-key k kill-session
bind-key -n M-Enter new-session
bind-key -n M-f run-shell 'sesh connect $(sesh list --icons | fzf-tmux -p 80%,70% \
	--no-sort --ansi --border-label " sesh " --prompt "⚡:" --layout=reverse \
	--header "a:all t:tmux g:configs x:zoxide d:tmux kill f:find" \
	--bind "tab:down,btab:up" \
	--bind "ctrl-a:change-prompt(⚡:)+reload(sesh list --icons)" \
	--bind "ctrl-t:change-prompt(🪟:)+reload(sesh list -t --icons)" \
	--bind "ctrl-g:change-prompt(⚙️:)+reload(sesh list -c --icons)" \
	--bind "ctrl-x:change-prompt(📁:)+reload(sesh list -z --icons)" \
	--bind "ctrl-f:change-prompt(🔎:)+reload(fd -H -d 2 -t d -E .Trash . ~)" \
	--bind "alt-d:execute(tmux kill-session -t {2..})+change-prompt(⚡:)+reload(sesh list --icons)" \
	--preview-window "right:55%" \
	--preview "sesh preview {}") || true'


#copy
bind-key -T copy-mode-vi ] send -X next-prompt
bind-key -T copy-mode-vi [ send -X previous-prompt
bind-key -T copy-mode-vi u send -X scroll-up
bind-key -T copy-mode-vi m send -X scroll-down
bind-key -T copy-mode-vi ? command-prompt -i -I "#{pane_search_string}" -T search -p "(search up)" { send-keys -X search-backward-incremental -- "%%" }
bind-key -T copy-mode-vi / command-prompt -i -I "#{pane_search_string}" -T search -p "(search down)" { send-keys -X search-forward-incremental -- "%%" }

#count from one
set -g base-index 1
set -g pane-base-index 1


#reset
unbind r
bind r source ~/.config/tmux/tmux.conf

#colors
set -g default-terminal "${TERM}"
set -sg terminal-overrides ",*:RGB"

#the bar
set -g status-position top
set -g status-style "bg=black"
set -g status-right "#{?client_prefix,#[fg=green] PREFIX #[default],}"
# set -g status-left "#[fg=yellow,bright]#S #{?client_prefix,#[fg=green] PREFIX #[default],}"
set -g status-left-length 100
set -g status-left "#[fg=yellow,bright]#S #{?client_prefix,#[fg=green] PREFIX #[default],}#[fg=colour243,dim] [ #(tmux ls -F '##S' | grep -v -x '#S' | tr '\\n' ' ')]#[default] "

#window buttons
set -g window-status-format ""
set -g window-status-current-format ""

# panes
set -g pane-border-lines simple

# QOL
set -g detach-on-destroy off
set -g mouse on
# Enter copy-mode with C-u if not already
#bind -n C-u copy-mode \; send -X halfpage-up

# Automatically set terminal title to session name
set -g set-titles on
set -g set-titles-string 'tmux: #S'
